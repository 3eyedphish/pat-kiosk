<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hellma PAT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Hellma Process Analytics</title>
<style>
/* Hellma PAT kiosk
   Layout: full-screen touch app. White sheet, Ident Blue banners carrying headlines (brand guide 3.1),
   product shots on a blue-gradient stage with a light spot (brand guide 3.3). Single light look by design. */
:root {
  --blue: #0072b6;          /* Ident Blue: graphic elements */
  --blue-dark: #00569d;     /* Hellma Blue: logo tone, pressed states */
  --blue-ink: #0a3a5f;
  --sky-1: #f4f8fc;
  --sky-2: #e4eef7;
  --sky-3: #c9ddef;
  --paper: #ffffff;
  --grey-1: #f2f2f2;        /* Light Grey */
  --grey-2: #e0e0e0;        /* Medium Grey */
  --grey-5: #878787;        /* Crown Grey */
  --grey-7: #575756;        /* Dark Grey */
  --ink: #1e2328;
  --beam-in: #1a8fd8;
  --beam-out: #f08a24;
  --ok: #2e7d4f;
  --warn: #c2410c;
  --review: #e07b00;
  --f-display: "DIN Next LT Pro", "DIN Pro", "DIN 2014", "D-DIN", "Barlow", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --f-body: "DIN Next LT Pro", "DIN Pro", "D-DIN", "Barlow", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --f-label: "DIN Alternate", "DIN Next LT Pro", "Barlow Semi Condensed", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --top: 4.25rem;
  --gut: clamp(16px, 2.6vw, 40px);
  --radius: 4px;
  color-scheme: light;
  font-size: clamp(16px, calc(1.2vmin + 7px), 22px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-weight: 400; line-height: 1.45;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; -webkit-text-size-adjust: 100%;
}
img { max-width: 100%; -webkit-user-drag: none; user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, textarea, select { font: inherit; -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-display); text-wrap: balance; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

/* ---------- Shared type ---------- */
.eyebrow { font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; color: var(--blue); }
.h1 { font-weight: 300; font-size: 2.3rem; line-height: 1.08; letter-spacing: -.01em; color: var(--ink); }
.h2 { font-weight: 400; font-size: 1.5rem; line-height: 1.15; }
.h3 { font-weight: 500; font-size: 1.12rem; line-height: 1.25; }
.lead { font-size: 1.12rem; color: var(--grey-7); max-width: 60ch; line-height: 1.5; }
.muted { color: var(--grey-7); }
.small { font-size: .85rem; }
.num { font-family: var(--f-label); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
#app { position: fixed; inset: 0; }
.shell { position: absolute; inset: 0; display: grid; grid-template-rows: var(--top) 1fr; }
.topbar {
  display: flex; align-items: center; gap: .5rem; padding: 0 var(--gut);
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--paper); border-bottom: 1px solid var(--grey-2); position: relative; z-index: 5;
}
.navbtn {
  display: inline-flex; align-items: center; gap: .45rem; height: 2.9rem; padding: 0 1rem; border-radius: 999px;
  font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .78rem;
  color: var(--blue-ink); background: var(--sky-1); border: 1px solid var(--sky-3);
}
.navbtn:active { background: var(--sky-2); }
.navbtn svg { width: 1.1rem; height: 1.1rem; }
.crumb { margin-left: .75rem; font-size: 1rem; color: var(--grey-7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumb b { color: var(--ink); font-weight: 500; }
.logo-btn { margin-left: auto; height: 100%; display: flex; align-items: center; padding-left: 1rem; }
.logo { height: 1.85rem; width: auto; display: block; }
.view { position: relative; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.page { padding: 1.6rem var(--gut) 7rem; display: grid; gap: 1.6rem; max-width: 1400px; margin: 0 auto; animation: pagein .35s ease both; }
@keyframes pagein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.cta {
  position: absolute; right: var(--gut); bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px)); z-index: 6;
  display: inline-flex; align-items: center; gap: .6rem; height: 3.6rem; padding: 0 1.5rem; border-radius: 999px;
  background: var(--blue); color: #fff; font-weight: 500; font-size: 1.05rem; box-shadow: 0 8px 24px rgba(0, 60, 110, .28);
}
.cta svg { width: 1.3rem; height: 1.3rem; }
.cta:active { background: var(--blue-dark); }

/* Page header: blue banner carrying the headline (brand guide basics) */
.banner { display: grid; gap: .5rem; padding: 1.4rem 1.6rem; background: var(--blue); color: #fff; border-radius: var(--radius); position: relative; overflow: hidden; }
.banner .eyebrow { color: rgba(255,255,255,.82); }
.banner .h1 { color: #fff; }
.banner .lead { color: rgba(255,255,255,.92); }
.banner::after { content: ""; position: absolute; right: -6rem; top: -6rem; width: 18rem; height: 18rem; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 65%); pointer-events: none; }
.pagehead { display: grid; gap: .55rem; }
.brandline { display: flex; align-items: center; gap: .75rem; }
.brandline img { height: 1.6rem; width: auto; }

/* ---------- Buttons, chips, tabs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3.2rem; padding: .6rem 1.3rem; border-radius: 999px; font-weight: 500; font-size: 1rem; border: 1.5px solid var(--blue); color: var(--blue); background: #fff; }
.btn.primary { background: var(--blue); color: #fff; }
.btn:active { transform: scale(.98); }
.btn svg { width: 1.15rem; height: 1.15rem; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.9rem; padding: .45rem 1.05rem; border-radius: 999px; border: 1.5px solid var(--grey-2); background: #fff; font-size: .98rem; color: var(--ink); }
.chip[aria-pressed="true"], .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip .sub { font-size: .78rem; opacity: .75; }
.tag { display: inline-flex; align-items: center; padding: .28rem .6rem; border-radius: 3px; font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .66rem; background: var(--sky-2); color: var(--blue-ink); }
.tag.solid { background: var(--blue); color: #fff; }
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; border-bottom: 1px solid var(--grey-2); }
.tab { min-height: 3.2rem; padding: 0 1.15rem; font-size: 1.02rem; color: var(--grey-7); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
.linkish { color: var(--blue); font-weight: 500; display: inline-flex; align-items: center; gap: .3rem; min-height: 2.6rem; }

/* ---------- Product stage (light spot) ---------- */
.stage {
  position: relative; overflow: hidden; border-radius: var(--radius);
  background:
    radial-gradient(ellipse 45% 40% at 58% 42%, rgba(255,255,255,1) 0%, rgba(255,255,255,.85) 35%, rgba(255,255,255,0) 70%),
    linear-gradient(160deg, #ffffff 0%, var(--sky-1) 30%, var(--sky-2) 70%, var(--sky-3) 100%);
  display: grid; place-items: center; height: 100%;
}
.stage img.prod { mix-blend-mode: multiply; object-fit: contain; width: 86%; height: 86%; }
.stage.photo img { mix-blend-mode: normal; width: 100%; height: 100%; object-fit: cover; }
.stage .spark { position: absolute; width: 16%; aspect-ratio: 1; left: 50%; top: 38%; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95), rgba(160,215,255,.35) 35%, rgba(255,255,255,0) 70%); mix-blend-mode: screen; pointer-events: none; animation: spark 5s ease-in-out infinite; }
@keyframes spark { 0%,100% { opacity: .55; transform: translate(-50%,-50%) scale(.9); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } }
.lowres-note { position: absolute; left: .6rem; bottom: .5rem; font-size: .66rem; color: var(--grey-5); background: rgba(255,255,255,.7); padding: .1rem .35rem; border-radius: 2px; display: none; }
body.review .lowres-note { display: block; }

/* ---------- Attract ---------- */
.attract { position: absolute; inset: 0; background: #0b2a44; overflow: hidden; z-index: 20; }
.attract .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.attract .slide.on { opacity: 1; }
.attract .slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); }
.attract .slide.on img { animation: kenburns 12s ease-out both; }
@keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.14); } }
.attract .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,30,52,0) 35%, rgba(4,30,52,.45) 100%); }
.attract .logo-plate { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 1.4rem); right: var(--gut); background: #fff; padding: .9rem 1.3rem; border-radius: 3px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
.attract .logo-plate .logo { height: 2.3rem; }
.attract .copy { position: absolute; left: var(--gut); right: var(--gut); bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); display: grid; gap: 1.1rem; justify-items: start; }
.attract .card { background: var(--blue); color: #fff; padding: 1.5rem 1.8rem 1.6rem; max-width: 46rem; border-radius: 3px; display: grid; gap: .55rem; box-shadow: 0 10px 40px rgba(0,30,60,.35); }
.attract .card .eyebrow { color: rgba(255,255,255,.85); }
.attract .card h1 { font-weight: 300; font-size: 2.9rem; line-height: 1.04; letter-spacing: -.01em; }
.attract .card p { font-size: 1.15rem; color: rgba(255,255,255,.92); }
.attract .touch { display: inline-flex; align-items: center; gap: .8rem; background: #fff; color: var(--blue-ink); border-radius: 999px; height: 3.6rem; padding: 0 1.6rem 0 1.2rem; font-weight: 500; font-size: 1.1rem; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.attract .touch .ring { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--blue); position: relative; }
.attract .touch .ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--blue); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .8; } to { transform: scale(2.2); opacity: 0; } }
.attract .dots { position: absolute; right: var(--gut); bottom: calc(2.4rem + env(safe-area-inset-bottom, 0px)); display: flex; gap: .5rem; }
.attract .dots i { width: .6rem; height: .6rem; border-radius: 50%; background: rgba(255,255,255,.45); }
.attract .dots i.on { background: #fff; }

/* ---------- Home ---------- */
.home-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 1rem; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 2fr); gap: 1.4rem; align-items: start; }
.hero-tile { position: sticky; top: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; height: min(36rem, calc(100vh - var(--top) - 11rem)); min-height: 24rem; border-radius: var(--radius); overflow: hidden; text-align: left; background: var(--blue); color: #fff; }
.hero-tile .stage { border-radius: 0; min-height: 0; }
.hero-tile .txt { padding: 1.3rem 1.5rem 1.5rem; display: grid; gap: .45rem; }
.hero-tile .txt h2 { font-weight: 300; font-size: 2rem; line-height: 1.05; }
.hero-tile .txt p { color: rgba(255,255,255,.9); }
.hero-tile .go { margin-top: .5rem; display: inline-flex; align-items: center; gap: .5rem; font-weight: 500; }
.groups { display: grid; gap: 1.3rem; }
.group-h { display: flex; align-items: center; gap: .8rem; margin-bottom: .6rem; }
.group-h img { height: 1.35rem; width: auto; }
.group-h .t { font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--grey-7); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .8rem; }
.tile { display: grid; grid-template-rows: 6.4rem auto; text-align: left; border: 1px solid var(--grey-2); border-radius: var(--radius); overflow: hidden; background: #fff; }
.tile:active { border-color: var(--blue); }
.tile .stage { border-radius: 0; }
.tile .stage img.prod { width: 78%; height: 78%; }
.tile .t { padding: .7rem .85rem .85rem; display: grid; gap: .15rem; }
.tile .t b { font-weight: 500; font-size: 1.02rem; line-height: 1.2; }
.tile .t span { font-size: .82rem; color: var(--grey-7); line-height: 1.3; }
.tile .stage svg { width: 92%; height: 92%; }

/* ---------- Finder ---------- */
.finder { display: grid; grid-template-columns: minmax(0, 22rem) minmax(0, 1fr); gap: 1.6rem; align-items: start; }
.filters { display: grid; gap: 1.15rem; position: sticky; top: 0; }
.fgroup { display: grid; gap: .5rem; }
.fgroup .lab { font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .7rem; color: var(--grey-7); }
.fgroup .row { gap: .45rem; }
.fgroup .chip { min-height: 2.75rem; padding: .35rem .9rem; font-size: .93rem; }
.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: .9rem; }
.pcard { display: grid; grid-template-rows: 9.5rem auto; text-align: left; border: 1px solid var(--grey-2); border-radius: var(--radius); overflow: hidden; background: #fff; transition: opacity .25s, transform .25s; }
.pcard:active { border-color: var(--blue); }
.pcard .stage { border-radius: 0; }
.pcard .body { padding: .8rem .95rem 1rem; display: grid; gap: .5rem; }
.pcard .nm { display: grid; gap: .05rem; }
.pcard .nm b { font-weight: 500; font-size: 1.15rem; }
.pcard .nm span { font-size: .8rem; color: var(--grey-7); }
.meter { display: grid; grid-template-columns: 3.6rem 1fr 4.6rem; gap: .5rem; align-items: center; font-size: .8rem; color: var(--grey-7); }
.meter .bar { position: relative; height: .42rem; border-radius: 99px; background: var(--grey-1); overflow: visible; }
.meter .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sky-3), var(--blue)); }
.meter .bar u { position: absolute; top: -.25rem; bottom: -.25rem; width: 2px; background: var(--warn); text-decoration: none; }
.meter .v { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.empty { border: 1.5px dashed var(--sky-3); border-radius: var(--radius); padding: 1.6rem; display: grid; gap: .8rem; justify-items: start; background: var(--sky-1); }

/* ---------- Product page ---------- */
.product { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 2rem; align-items: start; }
.gallery { display: grid; gap: .7rem; position: sticky; top: 0; }
.gallery .stage { aspect-ratio: 4 / 3.2; }
.thumbs { display: flex; gap: .6rem; }
.thumbs button { width: 5.6rem; height: 4.4rem; border: 1.5px solid var(--grey-2); border-radius: 3px; background: #fff; display: grid; place-items: center; overflow: hidden; }
.thumbs button[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px var(--sky-3); }
.thumbs img { width: 90%; height: 90%; object-fit: contain; mix-blend-mode: multiply; }
.thumbs .lbl { font-size: .7rem; color: var(--grey-7); }
.zoomhint { font-size: .8rem; color: var(--grey-7); display: inline-flex; gap: .35rem; align-items: center; }
.pinfo { display: grid; gap: 1.15rem; }
.ratings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
.rating { background: var(--sky-1); border: 1px solid var(--sky-2); border-radius: var(--radius); padding: .8rem .9rem; display: grid; gap: .1rem; }
.rating .k { font-family: var(--f-label); font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: .64rem; color: var(--grey-7); }
.rating .n { font-family: var(--f-label); font-weight: 700; font-size: 1.55rem; color: var(--blue-ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.rating .n small { font-size: .9rem; font-weight: 700; color: var(--grey-7); margin-left: .15rem; }
.specs { width: 100%; border-collapse: collapse; font-size: .98rem; }
.specs th { text-align: left; font-weight: 400; color: var(--grey-7); padding: .62rem 1rem .62rem 0; width: 34%; vertical-align: top; border-top: 1px solid var(--grey-2); }
.specs td { padding: .62rem 0; border-top: 1px solid var(--grey-2); font-variant-numeric: tabular-nums; }

/* ---------- Generic blocks ---------- */
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4rem; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.1rem; }
.panel { border: 1px solid var(--grey-2); border-radius: var(--radius); padding: 1.3rem 1.4rem; display: grid; gap: .85rem; align-content: start; background: #fff; }
.panel.sky { background: var(--sky-1); border-color: var(--sky-2); }
.bul { display: grid; gap: .55rem; }
.bul li { position: relative; padding-left: 1.3rem; }
.bul li::before { content: ""; position: absolute; left: 0; top: .62em; width: .5rem; height: .5rem; background: var(--blue); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
.bul.minus li::before { background: var(--grey-5); clip-path: none; height: 2px; top: .72em; }
.bul.plus li::before { background: var(--ok); }
.stat { display: grid; gap: .1rem; }
.stat .n { font-family: var(--f-label); font-weight: 700; font-size: 3rem; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 1.3rem; color: var(--blue-ink); margin-left: .2rem; }
.stat .l { font-size: .9rem; color: var(--grey-7); }
.figure { border: 1px solid var(--grey-2); border-radius: var(--radius); background: #fff; display: grid; place-items: center; padding: 1rem; position: relative; }
.figure img { max-height: 22rem; object-fit: contain; }
.figure .zoom { position: absolute; right: .5rem; bottom: .5rem; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--sky-1); border: 1px solid var(--sky-3); display: grid; place-items: center; color: var(--blue); }
.figure .zoom svg { width: 1.2rem; height: 1.2rem; }
.credit { font-size: .78rem; color: var(--grey-5); display: flex; align-items: center; gap: .5rem; }
.credit img { height: 1.1rem; width: auto; }
.mini { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .9rem; align-items: center; text-align: left; border: 1px solid var(--grey-2); border-radius: var(--radius); padding: .5rem .8rem .5rem .5rem; background: #fff; min-height: 4.2rem; }
.mini .stage { width: 4.6rem; height: 3.6rem; }
.mini .stage img.prod { width: 88%; height: 88%; }
.mini b { font-weight: 500; display: block; }
.mini span { font-size: .82rem; color: var(--grey-7); }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .6rem; }

/* ---------- Principles ---------- */
.principle { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.8rem; align-items: start; }
.diagram { background: linear-gradient(180deg, #fff, var(--sky-1)); border: 1px solid var(--sky-2); border-radius: var(--radius); padding: .6rem; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--f-body); }

/* ---------- Hexagon benefit grid ---------- */
.hexes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; max-width: 56rem; }
.hex { aspect-ratio: 1 / .92; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); background: var(--blue); color: #fff; display: grid; place-items: center; text-align: center; padding: 0 16%; font-size: .9rem; line-height: 1.2; font-weight: 500; }
.hex:nth-child(3n+2) { background: var(--blue-dark); }
.hex:nth-child(4n) { background: #2a86c4; }

/* ---------- Roadmap ---------- */
.road { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .8rem; counter-reset: step; }
.road button { display: grid; grid-template-rows: auto auto; gap: .5rem; justify-items: center; text-align: center; padding: .7rem .4rem; border-radius: var(--radius); border: 1px solid var(--grey-2); background: #fff; }
.road .ph { width: 4.4rem; height: 4.4rem; border-radius: 50%; overflow: hidden; border: 3px solid var(--sky-2); }
.road .ph img { width: 100%; height: 100%; object-fit: cover; }
.road .n { font-family: var(--f-label); font-weight: 700; color: var(--blue); font-size: .8rem; letter-spacing: .08em; }
.road b { font-weight: 500; font-size: .95rem; line-height: 1.2; }

/* ---------- Case study ---------- */
.case { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 1.6rem; align-items: start; }
.steps { display: grid; gap: .3rem; position: sticky; top: 0; }
.steps button { display: grid; grid-template-columns: 2.6rem 1fr; gap: .7rem; align-items: center; text-align: left; min-height: 3.3rem; padding: .3rem .6rem .3rem .3rem; border-radius: 999px; }
.steps button .ph { width: 2.6rem; height: 2.6rem; border-radius: 50%; overflow: hidden; border: 2px solid var(--sky-2); }
.steps button .ph img { width: 100%; height: 100%; object-fit: cover; }
.steps button[aria-current="step"] { background: var(--blue); color: #fff; }
.steps button[aria-current="step"] .ph { border-color: #fff; }
.stepbody { display: grid; gap: 1.2rem; }
.seg { justify-self: start; display: inline-flex; border: 1.5px solid var(--blue); border-radius: 999px; overflow: hidden; }
.seg button { min-height: 2.9rem; padding: 0 1.3rem; color: var(--blue); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.pager { display: flex; justify-content: space-between; gap: 1rem; }

/* ---------- Industries ---------- */
.ind-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .9rem; }
.ind { position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; text-align: left; }
.ind img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ind span { position: absolute; left: 0; bottom: 0; right: 0; padding: 2.5rem 1rem .9rem; color: #fff; font-size: 1.2rem; font-weight: 500; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,30,55,.75)); }
.ind[aria-pressed="true"] { outline: 4px solid var(--blue); outline-offset: 2px; }
.ind-detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 1.4rem; align-items: start; }
.ind-detail .ph { border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 10; }
.ind-detail .ph img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- About ---------- */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .8rem; }
.stats .stat { border-top: 3px solid var(--blue); padding-top: .6rem; }
.stats .stat .n { font-size: 2.4rem; }
.chain { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; }
.chain div { display: grid; gap: .5rem; }
.chain .ph { aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden; }
.chain .ph img { width: 100%; height: 100%; object-fit: cover; }
.sites { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem 1.4rem; }
.sites div { border-top: 1px solid var(--grey-2); padding-top: .6rem; }
.sites b { font-weight: 500; display: block; }

/* ---------- Form ---------- */
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.1rem 1.4rem; }
.field { display: grid; gap: .35rem; }
.field.full { grid-column: 1 / -1; }
.field label, .field .lab { font-size: .9rem; color: var(--grey-7); }
.field label b { color: var(--warn); font-weight: 500; }
.field input, .field textarea {
  font-size: 1.1rem; min-height: 3.4rem; padding: .6rem .9rem; border-radius: var(--radius);
  border: 1.5px solid var(--grey-2); background: #fff; color: var(--ink); width: 100%;
}
.field textarea { min-height: 6rem; resize: none; line-height: 1.4; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--sky-2); }
.field.err input { border-color: var(--warn); }
.field .msg { color: var(--warn); font-size: .85rem; min-height: 1.1em; }
.check { display: grid; grid-template-columns: 2rem 1fr; gap: .8rem; align-items: start; padding: .8rem 1rem; border: 1.5px solid var(--grey-2); border-radius: var(--radius); text-align: left; }
.check .box { width: 2rem; height: 2rem; border-radius: 4px; border: 2px solid var(--grey-5); display: grid; place-items: center; }
.check[aria-checked="true"] { border-color: var(--blue); background: var(--sky-1); }
.check[aria-checked="true"] .box { background: var(--blue); border-color: var(--blue); }
.check .box svg { width: 1.3rem; height: 1.3rem; color: #fff; opacity: 0; }
.check[aria-checked="true"] .box svg { opacity: 1; }
.check.err { border-color: var(--warn); }
.thanks { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.thanks .inner { display: grid; gap: 1rem; justify-items: center; max-width: 36rem; }
.thanks .mark { width: 5rem; height: 5rem; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.thanks .mark svg { width: 2.6rem; height: 2.6rem; }

/* ---------- Overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(6, 30, 50, .55); padding: var(--gut); }
.sheet { background: #fff; border-radius: 6px; padding: 1.6rem; width: min(100%, 34rem); display: grid; gap: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.idle .sheet { text-align: center; justify-items: center; }
.countdown { width: 6rem; height: 6rem; position: relative; }
.countdown svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.countdown b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-label); font-size: 2rem; color: var(--blue); }
.pinpad { display: grid; grid-template-columns: repeat(3, 4.6rem); gap: .7rem; justify-content: center; }
.pinpad button { height: 4.6rem; border-radius: 50%; background: var(--sky-1); border: 1px solid var(--sky-3); font-size: 1.6rem; font-family: var(--f-label); color: var(--blue-ink); }
.pinpad button:active { background: var(--sky-2); }
.pindots { display: flex; gap: .8rem; justify-content: center; }
.pindots i { width: 1rem; height: 1rem; border-radius: 50%; border: 2px solid var(--blue); }
.pindots i.on { background: var(--blue); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
.lightbox { background: rgba(6, 20, 35, .92); padding: 0; place-items: stretch; }
.lightbox .scroller { overflow: auto; -webkit-overflow-scrolling: touch; display: grid; place-items: center; padding: 4.5rem 1.5rem 1.5rem; }
.lightbox img { background: #fff; max-width: none; width: auto; max-height: calc(100vh - 7rem); border-radius: 3px; }
.lightbox.zoomed img { max-height: none; width: 220%; }
.lightbox .bar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: .8rem 1rem; color: #fff; z-index: 2; }
.lightbox .bar .btn { background: #fff; }

/* Staff panel */
.staff { place-items: stretch; padding: 0; background: rgba(6, 30, 50, .6); }
.staff .sheet { width: 100%; max-width: none; height: 100%; border-radius: 0; overflow: auto; align-content: start; padding: 1.4rem var(--gut) 3rem; }
.staff table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.staff th, .staff td { text-align: left; padding: .45rem .6rem .45rem 0; border-top: 1px solid var(--grey-2); vertical-align: top; }
.staff th { color: var(--grey-7); font-weight: 400; }
.staff .tablewrap { overflow-x: auto; max-height: 40vh; overflow-y: auto; border: 1px solid var(--grey-2); border-radius: var(--radius); padding: 0 .6rem; }
.staff textarea { width: 100%; min-height: 10rem; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; }
.staff select, .staff input[type=text] { min-height: 2.8rem; border: 1.5px solid var(--grey-2); border-radius: var(--radius); padding: 0 .7rem; font-size: 1rem; background: #fff; }
.hold { position: relative; overflow: hidden; border-color: var(--warn); color: var(--warn); }
.hold i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(194, 65, 12, .15); }
.toast { position: absolute; left: 50%; bottom: 6rem; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .8rem 1.2rem; border-radius: 6px; z-index: 60; max-width: min(90vw, 40rem); font-size: .95rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

/* Review mode: values still to confirm */
.chk { }
body.review .chk { outline: 2px dashed var(--review); outline-offset: 2px; background: #fff4e5; border-radius: 2px; }
.chk-note { display: none; }
body.review .chk-note { display: block; border: 2px dashed var(--review); background: #fff4e5; color: #7a3e00; padding: .6rem .8rem; border-radius: var(--radius); font-size: .88rem; }
body.review .chk-note::before { content: "To confirm: "; font-weight: 600; }

/* ---------- Responsive: portrait and smaller iPads ---------- */
@media (max-aspect-ratio: 1/1) {
  .home-grid { grid-template-columns: 1fr; }
  .hero-tile { position: relative; height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto; }
  .hero-tile .stage { min-height: 13rem; }
  .finder { grid-template-columns: 1fr; }
  .filters { position: static; }
  .product { grid-template-columns: 1fr; }
  .gallery { position: static; }
  .principle { grid-template-columns: 1fr; }
  .case { grid-template-columns: 1fr; }
  .steps { position: static; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .steps button { grid-template-columns: 1fr; justify-items: center; text-align: center; border-radius: var(--radius); padding: .4rem .2rem; font-size: .8rem; }
  .ind-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ind-detail { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chain { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .road { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hexes { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .attract .card h1 { font-size: 2.4rem; }
}
@media (max-width: 700px) {
  .cols2, .cols3, .form, .sites { grid-template-columns: 1fr; }
  .hero-tile { grid-template-columns: 1fr; }
  .ratings { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hexes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .road { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ind-grid { grid-template-columns: 1fr; }
  .crumb { display: none; }
  .h1 { font-size: 1.9rem; }
  .attract .card h1 { font-size: 2rem; }
  .cta { height: 3.1rem; padding: 0 1.1rem; font-size: .95rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Diagram internals ---------- */
.beam { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 12; animation: flow 1.1s linear infinite; }
.beam.in { stroke: var(--beam-in); }
.beam.out { stroke: var(--beam-out); }
.beam.green { stroke: #2fb36b; }
.beam.rev { animation-direction: normal; }
.beam.faint { stroke-width: 2.5; opacity: .45; }
.beam-halo { fill: none; stroke-width: 12; stroke-linecap: round; opacity: .16; }
.beam-halo.in { stroke: var(--beam-in); }
.beam-halo.out { stroke: var(--beam-out); }
.beam-halo.green { stroke: #2fb36b; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.lbl { font-size: 15px; fill: var(--grey-7); }
.lbl.b { fill: var(--blue-ink); font-weight: 600; }
.lbl.s { font-size: 13px; }
.lbl.w { fill: #fff; font-weight: 500; }
.lbl.xl { font-size: 26px; }
.lbl.m { font-size: 19px; }
.leader { stroke: var(--grey-5); stroke-width: 1.2; fill: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
.particle { animation: drift 7s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(14px, -8px); } }
.flowchev { animation: chev 1.4s linear infinite; }
@keyframes chev { from { transform: translateX(-20px); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(40px); opacity: 0; } }
.drip { animation: flow 1s linear infinite; }
.march { animation: flow 1.2s linear infinite; }
.trace { stroke-dasharray: 200; animation: trace 3s ease-in-out infinite; }
@keyframes trace { from { stroke-dashoffset: 200; } 60%, to { stroke-dashoffset: 0; } }
.pop { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; } to { opacity: 1; } }
.pos { cursor: pointer; transition: opacity .3s; }
.pos.dim { opacity: .5; }
.pos.sel .lbl.b { fill: var(--blue); }
.mp, .vst, .wseg { cursor: pointer; }
.dial { transition: transform .5s cubic-bezier(.5, 0, .2, 1); }
.wseg path { transition: fill .2s; }

</style>

  var Store = {
    db: null, ok: false,

  function csvOf(leads) {
    var cols = ["Date", "Time", "Event", "First name", "Last name", "Company", "Job title", "Email", "Phone", "Location", "Interested in", "Requests", "Message", "Products viewed", "Consent"];
    function q(v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var rows = leads.slice().sort(function (a, b) { return a.ts - b.ts; }).map(function (l) {
      var d = new Date(l.ts);
      var date = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      var time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      return [date, time, l.event, l.first, l.last, l.company, l.title, l.email, l.phone, l.location, (l.interests || []).join("; "), (l.requests || []).join("; "), l.message, (l.viewed || []).join("; "), l.consent ? "Yes" : "No"].map(q).join(",");
    });
    return "﻿" + cols.join(",") + "\n" + rows.join("\n") + "\n";
  }
  function copyText(text) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { }
      ta.remove(); return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }
  function collectChecks() {
    var out = [];
    (function walk(o, path) {
      if (!o || typeof o !== "object") return;
      if (typeof o.check === "string") out.push({ path: path, note: o.check, v: o.v });
      Object.keys(o).forEach(function (k) {
        if (k === "check") return;
        if (/Check$/.test(k) && typeof o[k] === "string") out.push({ path: path + " › " + k.replace(/Check$/, ""), note: o[k] });
        walk(o[k], path ? path + " › " + k : k);
      });
    })(C, "");
    return out;
  }

  function openStaff() {
    var st = $("#staff");
    Store.all().then(function (leads) {
      var rows = leads.map(function (l) {
        var d = new Date(l.ts);
        return "<tr><td>" + d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "</td><td>" + esc(l.first + " " + l.last) + "</td><td>" + esc(l.company) + "</td><td>" + esc(l.email) + "</td><td>" + esc((l.interests || []).join(", ")) + "</td><td>" + esc((l.requests || []).join(", ")) + "</td></tr>";
      }).join("");
      var checks = collectChecks();
      st.innerHTML = '<div class="sheet">' +
        '<div class="row" style="justify-content:space-between"><div><div class="eyebrow">Staff only</div><h1 class="h1" style="font-size:2rem">Kiosk settings and leads</h1></div><button class="btn" type="button" id="st-close">' + I.close + "Close</button></div>" +
        '<div class="cols3"><div class="stat"><span class="n">' + leads.length + '</span><span class="l">Leads stored on this iPad</span></div>' +
        '<div class="stat"><span class="n" style="font-size:1.4rem">' + (leads[0] ? new Date(leads[0].ts).toLocaleString() : "None yet") + '</span><span class="l">Latest lead</span></div>' +
        '<div class="stat"><span class="n" style="font-size:1.4rem">' + (Store.ok ? "IndexedDB + backup" : "Backup storage only") + '</span><span class="l">Storage</span></div></div>' +
        '<section class="panel"><h2 class="h3">Export leads</h2><p class="muted small">Export at the end of each day. Leads stay on this iPad until you delete them.</p>' +
        '<div class="row">' + (CAN_SHARE_FILES ? '<button class="btn primary" type="button" id="st-share">Share CSV (Mail, AirDrop, Files)</button>' : "") + '<button class="btn' + (CAN_SHARE_FILES ? "" : " primary") + '" type="button" id="st-dl">Download CSV</button><button class="btn" type="button" id="st-copy">Copy CSV</button><button class="btn" type="button" id="st-show">Show as text</button>' +
        '<button class="btn hold" type="button" id="st-del"><i></i>Hold 3 s to delete all leads</button></div><textarea id="st-text" hidden readonly></textarea>' +
        '<div class="tablewrap"><table><thead><tr><th>When</th><th>Name</th><th>Company</th><th>Email</th><th>Interested in</th><th>Requests</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="muted">No leads yet.</td></tr>') + "</tbody></table></div></section>" +
        '<section class="panel"><h2 class="h3">Settings</h2><div class="cols2">' +
        '<label class="field"><span class="lab">Event name (saved with each lead)</span><input type="text" id="st-event" value="' + esc(settings.event) + '" placeholder="e.g. IFPAC 2027"></label>' +
        '<label class="field"><span class="lab">Start over after no touch for</span><select id="st-idle">' + [60, 90, 120, 180, 300].map(function (s) { return '<option value="' + s + '"' + (s === settings.idle ? " selected" : "") + ">" + s + " seconds</option>"; }).join("") + "</select></label>" +
        '<label class="field"><span class="lab">New 4-digit PIN</span><input type="text" id="st-pin" inputmode="numeric" maxlength="4" placeholder="Leave empty to keep the current PIN"></label>' +
        '<div class="field"><span class="lab">Review mode</span><button class="check" type="button" id="st-review" role="checkbox" aria-checked="' + settings.review + '"><span class="box">' + I.check + "</span><span>Highlight values to confirm (" + checks.length + ")</span></button></div>" +
        '</div><div class="row"><button class="btn primary" type="button" id="st-save">Save settings</button><button class="btn" type="button" id="st-attract">Start attract screen</button></div></section>' +
        '<section class="panel"><h2 class="h3">This iPad</h2><div class="cols3">' +
        '<div class="stat"><span class="l">Opened as</span><span class="n" style="font-size:1.15rem">' + (standalone() ? "Home Screen app" : "Browser tab") + "</span></div>" +
        '<div class="stat"><span class="l">Offline</span><span class="n" style="font-size:1.15rem" id="st-offline">Checking…</span></div>' +
        '<div class="stat"><span class="l">Lead storage</span><span class="n" style="font-size:1.15rem" id="st-persist">Checking…</span></div></div>' +
        (window.KIOSK_PWA ? '<div class="row"><button class="btn" type="button" id="st-update">Check for update</button><span class="muted small">Updates also install on their own when the iPad is online, at the next start-over.</span></div>' : "") + "</section>" +
        '<section class="panel"><h2 class="h3">Open questions in the content (' + checks.length + ')</h2><p class="muted small">These values are shown on the kiosk but still need confirming. With review mode on they are outlined in orange; tap one to read its note.</p>' +
        '<div class="tablewrap" style="max-height:none"><table><tbody>' + checks.map(function (c) { return '<tr><td style="width:30%">' + esc(c.path.replace(/^(\w+) › /, "$1 › ")) + "</td><td>" + (c.v ? "<b style=\"font-weight:500\">" + esc(c.v) + "</b><br>" : "") + esc(c.note) + "</td></tr>"; }).join("") + "</tbody></table></div></section>" +
        '<p class="muted small">' + esc(C.meta.title) + " kiosk · version " + esc(C.meta.version) + " · built " + esc(window.KIOSK_BUILT || "") + "</p></div>";
      st.hidden = false;
      offlineStatus().then(function (t) { var e = $("#st-offline", st); if (e) e.textContent = t; });
      storageStatus().then(function (t) { var e = $("#st-persist", st); if (e) e.textContent = t; });
      var upd = $("#st-update", st);
      if (upd) upd.onclick = function () {
        if (!PWA.reg) { toast("Updates work when the kiosk is opened from its web address."); return; }
        toast("Checking for an update…");
        if (PWA.updateReady) { toast("Update installed. Restarting…"); setTimeout(function () { location.reload(); }, 800); return; }
        var t0 = Date.now();
        PWA.reg.update().then(function () {
          if (PWA.reg.installing || PWA.reg.waiting) toast("Downloading the update. The kiosk restarts when it's ready.", 8000);
          var poll = setInterval(function () {
            if (PWA.updateReady) { clearInterval(poll); toast("Update installed. Restarting…"); setTimeout(function () { location.reload(); }, 800); return; }
            if (!(PWA.reg.installing || PWA.reg.waiting) && Date.now() - t0 > 5000) { clearInterval(poll); toast("This is the latest version."); }
          }, 300);
        }, function () { toast("Couldn't reach the server. Check the Wi-Fi and try again."); });
      };
      var sh = $("#st-share", st);
      if (sh) sh.onclick = function () {
        var name = "hellma-leads-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".csv";
        var file = new File([csvOf(leads)], name, { type: "text/csv" });
        navigator.share({ files: [file], title: "Hellma kiosk leads" }).catch(function (e) { if (e && e.name !== "AbortError") toast("Sharing didn't work here. Use Copy CSV instead."); });
      };
      $("#st-close", st).onclick = function () { st.hidden = true; };
      $("#st-attract", st).onclick = function () { st.hidden = true; go("attract"); };
      $("#st-review", st).onclick = function () { var b = $("#st-review", st), on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on); settings.review = on; saveSettings(); document.body.classList.toggle("review", on); };
      $("#st-save", st).onclick = function () {
        settings.event = $("#st-event", st).value.trim(); settings.idle = Number($("#st-idle", st).value);
        var np = $("#st-pin", st).value.trim();
        if (np && !/^\d{4}$/.test(np)) { toast("The PIN must be exactly 4 digits."); return; }
        if (np) settings.pin = np;
        var ok = saveSettings(); toast(np ? "Settings saved. New PIN is active." : "Settings saved.");
      };
      $("#st-dl", st).onclick = function () {
        var csv = csvOf(leads), name = "hellma-leads-" + new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-") + ".csv";
        try {
          var blob = new Blob([csv], { type: "text/csv;charset=utf-8" }), url = URL.createObjectURL(blob);
          var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
          toast("Download started. If nothing happens, use Copy CSV or Show as text.", 5000);
        } catch (e) { toast("Download isn't available here. Use Copy CSV or Show as text.", 5000); }
      };
      $("#st-copy", st).onclick = function () { copyText(csvOf(leads)).then(function (ok) { toast(ok ? "Copied " + leads.length + " leads. Paste into Mail, Notes or Excel." : "Copy was blocked here. Use Show as text, then select all and copy."); }); };
      $("#st-show", st).onclick = function () { var ta = $("#st-text", st); ta.hidden = !ta.hidden; ta.value = csvOf(leads); if (!ta.hidden) { ta.focus(); ta.select(); } };
      var del = $("#st-del", st), holdT = null, holdStart = 0;
      function holdEnd() { clearInterval(holdT); $("i", del).style.width = "0"; }
      del.addEventListener("pointerdown", function () {
        holdStart = Date.now(); clearInterval(holdT);
        holdT = setInterval(function () {
          var p = Math.min(1, (Date.now() - holdStart) / 3000); $("i", del).style.width = (p * 100) + "%";
          if (p >= 1) { holdEnd(); Store.clear().then(function () { toast("All leads deleted from this iPad."); openStaff(); }); }
        }, 50);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { del.addEventListener(ev, holdEnd); });
    });
  }

  /* ---------------- Kiosk hardening ---------------- */
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("touchmove", function (e) { if (e.touches && e.touches.length > 1 && !e.target.closest("#lightbox")) e.preventDefault(); }, { passive: false });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("click", function (e) { var a = e.target.closest("a[href]"); if (a) e.preventDefault(); }, true);
  window.addEventListener("submit", function (e) { e.preventDefault(); }, true);

  /* ---------------- Start ---------------- */
  document.body.classList.toggle("review", !!settings.review);
  buildAttract();
  initPwa();
  Store.init().then(function () { });
  var start = (location.hash || "").replace(/^#/, "");
  if (start && /^[a-z]/.test(start) && SCREENS[start.split("/")[0]]) go(start.replace(/~/g, "/")); else showAttract();
  window.KIOSK_APP = { go: go, store: Store, settings: settings, openStaff: openStaff };
})();

</script>
</body>
</html>
